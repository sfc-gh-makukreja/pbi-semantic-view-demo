verified_queries:
  - question: How have total orders, units sold, and sales revenue trended year over year?
    name: How have total orders, units sold, and sales revenue trended year over year?
    sql: |-
      WITH yearly_metrics AS (
          SELECT *
          FROM SEMANTIC_VIEW(
              TB_PBI_DEMO.SEMANTIC.TASTY_BYTES_SV
              METRICS order_count, order_qty, order_amt
              DIMENSIONS year
          )
      )
      SELECT
          curr.year AS curr_year,
          prev.year AS prev_year,
          curr.order_count AS curr_order_count,
          prev.order_count AS prev_order_count,
          curr.order_count - prev.order_count AS order_count_chg,
          (curr.order_count - prev.order_count) / NULLIF(prev.order_count, 0) AS order_count_pct_chg,
          curr.order_qty AS curr_order_qty,
          prev.order_qty AS prev_order_qty,
          curr.order_qty - prev.order_qty AS order_qty_chg,
          (curr.order_qty - prev.order_qty) / NULLIF(prev.order_qty, 0) AS order_qty_pct_chg,
          curr.order_amt AS curr_order_amt,
          prev.order_amt AS prev_order_amt,
          curr.order_amt - prev.order_amt AS order_amt_chg,
          (curr.order_amt - prev.order_amt) / NULLIF(prev.order_amt, 0) AS order_amt_pct_chg
      FROM yearly_metrics AS curr
      LEFT JOIN yearly_metrics AS prev
          ON CAST(curr.year AS INTEGER) = CAST(prev.year AS INTEGER) + 1
      ORDER BY curr_year DESC NULLS LAST
       -- Generated by Cortex Analyst (request_id: b0b53ac1-a902-4b77-acf1-b2c820febc07)
      ;
    verified_by: MKUKREJA
    verified_at: 1791696333
    use_as_onboarding_question: false
  - name: What were total sales year-to-date for 2022, total sales for the same period in 2021, and the year-over-year growth rate between those two periods?
    sql: |-
      SELECT *
      FROM SEMANTIC_VIEW(
          TB_PBI_DEMO.SEMANTIC.TASTY_BYTES_SV
          METRICS order_amt_ytd, order_amt_pytd, yoy_order_amt_growth
      )
       -- Generated by Cortex Analyst (request_id: 5a77f42d-6478-4db5-b93f-4dcc6618d73b)
      ;
